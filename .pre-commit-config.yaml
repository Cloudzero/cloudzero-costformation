# Local pre-commit hooks. Install once with:
#   uvx pre-commit install
# Run `uvx pre-commit autoupdate --freeze` periodically to bump the pinned
# revs (--freeze keeps them as immutable commit SHAs).
repos:
  # Secret detection — blocks commits that contain credentials.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # Lint + format, using this repo's ruff config in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 65dbdb59d2f2d9c3bdc343c566821ad3319ddaa3  # frozen: v0.16.3
    hooks:
      - id: ruff
      - id: ruff-format
