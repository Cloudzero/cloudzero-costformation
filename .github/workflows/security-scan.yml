name: Security Scan

# Secret + dependency-license scanning.
# Self-contained: runs on forks with no repository secrets.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"  # weekly full-history sweep (Mondays 09:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history so scheduled/manual runs scan every commit
      - name: Run gitleaks
        # Route event fields through env vars rather than interpolating ${{ }}
        # directly into the script body (GitHub Actions hardening guidance).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # On PRs, scan only the pushed commits; otherwise scan the full history.
          LOG_OPTS=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            LOG_OPTS="--log-opts=${BASE_SHA}..${HEAD_SHA}"
          fi
          # gitleaks v8.30.1, pinned by immutable digest (bump manually on upgrade)
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --verbose --exit-code=1 $LOG_OPTS /repo

  license-scan:
    name: Dependency license scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: uv sync --no-dev
      - name: Fail on any dependency license not on the approved allow-list
        run: |
          # Fail closed: anything not explicitly approved —
          # including unknown/unclassified or copyleft licenses — fails the gate.
          # Extend the allow-list when a new dependency adds another OSI-approved
          # permissive license; today the runtime tree is just PyYAML (MIT).
          uvx pip-licenses==5.5.5 --python .venv/bin/python --from=mixed \
            --with-urls --format=markdown \
            --allow-only="Apache Software License;Apache-2.0;MIT License;MIT;BSD License;BSD-2-Clause;BSD-3-Clause;ISC License (ISCL);ISC;The Unlicense (Unlicense);Python Software Foundation License"
