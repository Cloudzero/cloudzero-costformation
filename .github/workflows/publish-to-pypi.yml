name: Publish 🐍📦 to PyPI

# Publishes cloudzero-costformation to public PyPI when a GitHub Release is
# published (or on manual dispatch). Authentication uses PyPI Trusted
# Publishing (OIDC) — no API tokens or repository secrets. The pypi.org
# Trusted Publisher registration must match: owner Cloudzero, repository
# cloudzero-costformation, workflow publish-to-pypi.yml, environment release.

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history for the release-ancestry check
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.12"
      - name: Verify release provenance
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The release tag must match the package version, and the released
          # commit must be on main — otherwise a mis-tagged release (stale
          # commit, wrong tag, or a side branch) would publish the wrong
          # artifacts to PyPI, where versions are immutable.
          VERSION=$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" costformation/__init__.py)
          if [ -z "$VERSION" ]; then
            echo "Failed to read __version__ from costformation/__init__.py"
            exit 1
          fi
          if [ "$EVENT_NAME" = "release" ] && [ "$TAG" != "$VERSION" ]; then
            echo "Release tag '$TAG' does not match costformation.__version__ '$VERSION'."
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The released commit is not on main; refusing to publish."
            exit 1
          fi
      - name: Build package
        run: uv build
      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: package-distributions
          path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: release
      url: https://pypi.org/p/cloudzero-costformation
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    steps:
      # retrieve the distribution packages
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: package-distributions
          path: dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
