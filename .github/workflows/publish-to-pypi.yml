name: Publish to PyPI

# Publishes cloudzero-costformation to public PyPI whenever a merge to main
# changes costformation/__init__.py (where __version__ lives). The
# check-publish-gates workflow enforces on the PR that the version was bumped
# and CHANGELOG.md has a matching, non-empty section.
#
# Authentication uses PyPI Trusted Publishing (OIDC) — no API tokens or
# repository secrets. One-time setup on pypi.org for the
# cloudzero-costformation project:
#   owner: Cloudzero, repository: cloudzero-costformation,
#   workflow: publish-to-pypi.yml, environment: pypi

on:
  push:
    branches:
      - main
    paths:
      - costformation/__init__.py

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC)
      contents: write  # push the release tag after a successful publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history so all release tags are visible

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.12"

      - name: Read version and determine what needs doing
        id: version
        env:
          PYPI_PROJECT: cloudzero-costformation
        run: |
          VERSION=$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" costformation/__init__.py)
          if [ -z "$VERSION" ]; then
            echo "Failed to read __version__ from costformation/__init__.py"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git tag | grep -qx "$VERSION"; then
            # A tag for this version must point at this commit — otherwise the
            # version was already released from a different commit and this
            # push reused it without bumping. Fail loudly rather than
            # silently accepting the collision.
            TAG_COMMIT=$(git rev-list -n 1 "$VERSION")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "Tag $VERSION points to $TAG_COMMIT, not the current release commit $HEAD_COMMIT."
              echo "The version in costformation/__init__.py was already released from another commit; bump it."
              exit 1
            fi
            echo "Tag $VERSION already exists on this commit; nothing to do."
            echo "tag=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=true" >> "$GITHUB_OUTPUT"
          # Retry safety: PyPI files are immutable, so a rerun after a
          # publish-succeeded-but-tag-push-failed run must not re-upload.
          # When the version is already live, the upload is skipped and a
          # verification step below proves this commit reproduces the
          # published artifacts before the tag is restored — so a version
          # published manually or from a different commit can never get this
          # commit tagged as its release. Only an authoritative 200 counts as
          # "already published"; a 404 or transient error falls through to a
          # publish attempt, where --check-url plus the reproducible build
          # still make a duplicate upload safe.
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/${PYPI_PROJECT}/${VERSION}/json" || echo 000)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Version $VERSION is already on PyPI; will verify artifacts match before tagging."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build sdist and wheel
        # Runs on the verification path too: the build is what gets compared
        # against PyPI's published artifacts.
        if: steps.version.outputs.tag == 'true'
        run: |
          # Reproducible artifacts: clamp archive timestamps to the release
          # commit so a rebuild produces the same files, for both
          # `uv publish --check-url` and the provenance check below.
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          uv build

      - name: Verify already-published artifacts match this commit
        if: steps.version.outputs.tag == 'true' && steps.version.outputs.publish == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PYPI_PROJECT: cloudzero-costformation
        run: |
          python3 - <<'VERIFY'
          import hashlib
          import json
          import os
          import pathlib
          import sys
          import urllib.request

          project = os.environ['PYPI_PROJECT']
          version = os.environ['VERSION']
          url = f'https://pypi.org/pypi/{project}/{version}/json'
          with urllib.request.urlopen(url) as resp:
              published = {f['filename']: f['digests']['sha256'] for f in json.load(resp)['urls']}
          local = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('dist').iterdir()}
          # Strict set equality both ways: extra files on either side are a mismatch.
          mismatched = sorted(name for name in local.keys() | published.keys() if local.get(name) != published.get(name))
          if mismatched:
              print(f'PyPI already has {project} {version}, but artifacts built from this commit')
              print(f'do not match the published files: {", ".join(mismatched)}.')
              print('Refusing to tag this commit as the release — the published version came from')
              print('a different commit or a manual upload. Reconcile and push the tag by hand.')
              sys.exit(1)
          print('Published artifacts match this commit; safe to restore the tag.')
          VERIFY

      - name: Publish to PyPI
        if: steps.version.outputs.publish == 'true'
        # --check-url makes this idempotent: files already on PyPI are skipped,
        # so a rerun after a partial failure (e.g. the tag push below failed)
        # doesn't die on PyPI's duplicate-upload rejection before tagging.
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/

      - name: Tag the release
        if: steps.version.outputs.tag == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"
