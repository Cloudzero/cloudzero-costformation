version: 2
updates:
  # GitHub Actions are pinned by commit SHA; keep the pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7  # match the repo's 7-day dependency-freshness buffer

  # Python dependencies locked in uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7  # match [tool.uv] exclude-newer = "7 days"
